name: Deploy Settle web to GitHub Pages

on:
  push:
    branches:
      - claude/settle-mobile-access-35as3n
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-settle-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Export Expo web (static)
        run: npx expo export --platform web

      # Publishes the static export to the gh-pages branch, which GitHub
      # Pages already serves at https://bapteol1.github.io/BapteOL1/.
      # .nojekyll is added automatically so the _expo/ directory is served.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
